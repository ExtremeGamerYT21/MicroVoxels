name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libvulkan-dev libglfw3-dev libglm-dev glslang-tools mesa-vulkan-drivers vulkan-validationlayers xvfb
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          for shader in build/shaders/*.spv; do spirv-val --target-env vulkan1.1 "$shader"; done
      - name: Grid tests
        run: ctest --test-dir build --output-on-failure
      - name: GPU reference and freeze checks on software Vulkan
        env:
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: |
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          xvfb-run -a ./build/microvoxels --scene test --hidden --validation --verify --exercise --frames 8 --width 480 --height 360 --no-ui --report captures/ci.json
          xvfb-run -a ./build/microvoxels --scene test --hidden --validation --verify --supersampling --frames 3 --width 320 --height 240 --no-ui --report captures/supersampling.json
          xvfb-run -a ./build/microvoxels --scene test --hidden --validation --verify --exercise-controls --frames 16 --width 480 --height 360 --no-ui --report captures/controls.json
          xvfb-run -a ./build/microvoxels --scene test --hidden --validation --verify --point-splats --exercise --frames 8 --width 480 --height 360 --no-ui --report captures/point-exercise.json
          xvfb-run -a ./build/microvoxels --scene test --hidden --validation --exercise-stability --frames 12 --width 640 --height 480 --no-ui --point-splats --capture-sequence captures/motion-point --report captures/motion-point.json
          xvfb-run -a ./build/microvoxels --scene test --hidden --validation --exercise-stability --frames 12 --width 640 --height 480 --no-ui --capture-sequence captures/motion-footprint --report captures/motion-footprint.json
          xvfb-run -a ./build/microvoxels --scene test --hidden --validation --verify --frames 3 --width 320 --height 240 --no-ui --levels 1 --voxel-size .0057 --footprint-radius 2 --footprint-limit 4 --time 1 --report captures/limits.json
          xvfb-run -a ./build/microvoxels --scene test --hidden --validation --verify --point-splats --no-adaptive-lod --frames 3 --width 640 --height 480 --no-ui --voxel-size .0057 --lod-distance 8.6 --time 1 --screenshot captures/point.ppm --report captures/point-fine.json
          xvfb-run -a ./build/microvoxels --scene test --hidden --validation --verify --no-adaptive-lod --frames 3 --width 640 --height 480 --no-ui --voxel-size .0057 --lod-distance 8.6 --time 1 --screenshot captures/footprint.ppm --report captures/footprint-fine.json
          python3 tests/footprint_comparison.py captures/motion-point captures/motion-footprint captures/motion-point.json captures/motion-footprint.json captures/point.ppm captures/footprint.ppm captures/comparison.json
      - name: Garden scene reference, freeze and preview
        env:
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: |
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          xvfb-run -a ./build/microvoxels --scene garden --hidden --validation --verify --exercise --frames 8 --width 480 --height 360 --no-ui --report captures/garden.json
          xvfb-run -a ./build/microvoxels --scene garden --hidden --validation --verify --time 1 --frames 3 --width 1100 --height 720 --no-ui --screenshot captures/garden.ppm --report captures/garden-preview.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            captures/*.json
            captures/garden.ppm
      - name: Compare hardware draw paths, near planes and frozen interiors
        env:
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: |
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          for scene in test garden; do
            for config in legacy-off indexed-off legacy-back indexed-back; do
              mesh=${config%-*}
              cull=${config#*-}
              name=captures/render-${scene}-${config}
              xvfb-run -a ./build/microvoxels --scene "$scene" --cube-mesh "$mesh" --cube-culling "$cull" --hidden --validation --exercise-render --frames 19 --width 320 --height 240 --voxel-size .12 --levels 1 --no-adaptive-lod --no-ui --capture-sequence "$name" --report "$name.json"
            done
            for config in indexed-off legacy-back indexed-back; do
              exact=()
              if [ "$config" = indexed-off ]; then exact=(--exact); fi
              python3 tests/cube_render_comparison.py captures/render-${scene}-legacy-off captures/render-${scene}-${config} captures/render-${scene}-${config}-comparison.json "${exact[@]}"
            done
          done
          xvfb-run -a ./build/microvoxels --scene test --cube-mesh indexed --cube-culling back --hidden --validation --verify --exercise-controls --frames 16 --width 480 --height 360 --no-ui --no-vsync --report captures/indexed-controls.json
          xvfb-run -a ./build/microvoxels --scene garden --cube-mesh indexed --cube-culling back --hidden --validation --verify --exercise --frames 8 --width 480 --height 360 --no-ui --report captures/indexed-exercise.json
          python3 - <<'PY'
          import json
          with open('captures/indexed-controls.json') as f:
              uncapped = json.load(f)
          with open('captures/indexed-exercise.json') as f:
              default = json.load(f)
          assert uncapped['vsync_requested'] is False
          assert uncapped['present_mode'] in ('immediate', 'mailbox', 'fifo')
          assert uncapped['control_checks'] == 16
          assert default['vsync_requested'] is True and default['present_mode'] == 'fifo'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cube-render-verification
          path: captures/render-*
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install glfw3:x64-windows glm:x64-windows vulkan-headers:x64-windows vulkan-loader:x64-windows "glslang[tools]:x64-windows"'
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVulkan_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include"
          "-DVulkan_LIBRARY=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/vulkan-1.lib"
          "-DVulkan_GLSLANG_VALIDATOR_EXECUTABLE=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/glslang/glslangValidator.exe"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Grid tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate Windows benchmark command
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/benchmark_voxel_draw.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; throw 'Benchmark PowerShell syntax failed' }
